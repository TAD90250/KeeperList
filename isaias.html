<!DOCTYPE html>
<html>
<head>
    <title>Isaias Keeper List — 2026</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        :root { --rams-blue:#003594; --rams-gold:#ffd100; --rams-white:#ffffff; }
        body { background:var(--rams-blue); color:var(--rams-white); }

        .hero {
            text-align:center; padding:40px 20px;
            background:linear-gradient(180deg,#003594 0%,#001a4d 100%);
            border-bottom:4px solid var(--rams-gold);
        }
        .hero h1 { font-size:48px; color:var(--rams-gold); text-shadow:0 0 10px rgba(255,209,0,.6); }
        .subtitle { font-size:22px; margin-top:10px; }

        .button-row {
            display:flex; overflow-x:auto; gap:12px; padding:20px; white-space:nowrap;
        }
        .team-card {
            background:#001a4d; border:2px solid var(--rams-gold);
            border-radius:10px; padding:15px 25px; color:var(--rams-white);
            font-size:18px; font-weight:bold; flex:0 0 auto; transition:.2s;
        }
        .team-card:hover { background:var(--rams-gold); color:#003594; transform:scale(1.05); }

        table {
            width:100%; border-collapse:collapse; margin-top:30px;
            background:#1a1a1a; border:1px solid #333; border-radius:10px; overflow:hidden;
        }
        th { background:#262626; color:#00ff99; padding:12px; font-size:18px; border-bottom:2px solid #333; }
        td { padding:10px; color:#e6e6e6; border-bottom:1px solid #333; }
        tr:nth-child(even){ background:#141414; }
        tr:hover{ background:#2a2a2a; }

        .table-container{ padding:20px; }

        footer {
            text-align:center; padding:20px; margin-top:40px;
            border-top:2px solid var(--rams-gold);
        }
    </style>
</head>

<body>

<header class="hero">
    <h1>Isaias Keeper List</h1>
    <p class="subtitle">2026 Season</p>
</header>

<section class="button-row">
    <a class="team-card" href="index.html">Home</a>
    <a class="team-card" href="chaps.html">Chaps</a>
    <a class="team-card" href="varo.html">Varo</a>
    <a class="team-card" href="amir.html">Amir</a>
    <a class="team-card" href="lopez.html">Lopez</a>
    <a class="team-card" href="felipe.html">Felipe</a>
    <a class="team-card" href="pepe.html">Pepe</a>
    <a class="team-card" href="paco.html">Paco</a>
    <a class="team-card" href="winnie.html">Winnie</a>
    <a class="team-card" href="yeyo.html">Yeyo</a>
    <a class="team-card" href="callo.html">Callo</a>
    <a class="team-card" href="rooney.html">Rooney</a>
</section>

<div class="table-container">
    <table id="keeperTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<footer>© 2026 Camarada's Fantasy Football League</footer>

<script>
async function loadCSV() {
    const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vS2z9HhUUoPgJDk7T6uGKQIveFn912gnaieysP3Zy_JV2MAuO5HEvv4ag_7c6Y0eEGzJNoGRyzqML_f/pub?gid=1145583353&single=true&output=csv";

    const response=await fetch(url);
    const csvText=await response.text();
    const rows=csvText.split("\n").map(r=>r.split(","));

    const headerRow=rows[0].slice(0,4);
    const bodyRows=rows.slice(1).slice(0,29);

    let headHTML="<tr>";
    headerRow.forEach(col=>headHTML+=`<th>${col.trim()}</th>`);
    headHTML+="</tr>";
    document.getElementById("tableHead").innerHTML=headHTML;

    let bodyHTML="";
    bodyRows.forEach(row=>{
        const sliced=row.slice(0,4);
        const hasData=sliced.some(col=>col.trim()!=="");
        if(!hasData) return;

        bodyHTML+="<tr>";
        sliced.forEach(col=>bodyHTML+=`<td>${col.trim()}</td>`);
        bodyHTML+="</tr>";
    });

    document.getElementById("tableBody").innerHTML=bodyHTML;
}
loadCSV();
</script>

</body>
</html>
