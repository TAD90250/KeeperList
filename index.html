<!DOCTYPE html>
<html>
<head>
    <title>Camarada's Fantasy Football League — 2026</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* RAMS COLORS */
        :root {
            --rams-blue: #003594;
            --rams-gold: #ffd100;
            --rams-white: #ffffff;
        }

        body {
            background: var(--rams-blue);
            color: var(--rams-white);
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #003594 0%, #001a4d 100%);
            border-bottom: 4px solid var(--rams-gold);
        }

        .hero h1 {
            font-size: 48px;
            color: var(--rams-gold);
            text-shadow: 0px 0px 10px rgba(255, 209, 0, 0.6);
        }

        .subtitle {
            font-size: 22px;
            color: var(--rams-white);
            margin-top: 10px;
        }

        /* TEAM GRID */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .team-card {
            background: #001a4d;
            border: 2px solid var(--rams-gold);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: var(--rams-white);
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s;
        }

        .team-card:hover {
            background: var(--rams-gold);
            color: #003594;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: var(--rams-white);
            border-top: 2px solid var(--rams-gold);
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>Camarada's Fantasy Football League</h1>
        <p class="subtitle">2026 Season — Keeper List Hub</p>
    </header>

    <section class="team-grid">
        <a class="team-card" href="chaps.html">Chaps</a>
        <a class="team-card" href="varo.html">Varo</a>
        <a class="team-card" href="amir.html">Amir</a>
        <a class="team-card" href="isaias.html">Isaias</a>
        <a class="team-card" href="lopez.html">Lopez</a>
        <a class="team-card" href="felipe.html">Felipe</a>
        <a class="team-card" href="pepe.html">Pepe</a>
        <a class="team-card" href="paco.html">Paco</a>
        <a class="team-card" href="winnie.html">Winnie</a>
        <a class="team-card" href="yeyo.html">Yeyo</a>
        <a class="team-card" href="callo.html">Callo</a>
        <a class="team-card" href="rooney.html">Rooney</a>
    </section>

    <footer>
        <p>© 2026 Camarada's Fantasy Football League</p>
    </footer>

</body>
</html>
